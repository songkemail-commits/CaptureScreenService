name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build CaptureScreenService
      run: dotnet build CaptureScreenService/CaptureScreenService.csproj --configuration Release --no-restore

    - name: Build Installer
      run: |
        cd Installer
        .\build.ps1

    - name: Test
      run: dotnet test --no-build --verbosity normal
